# Builds the portable, self-contained app and publishes it as a downloadable GitHub Release.
#
# The architecture-specific builds are hundreds of MB in total, which is why they are release
# assets rather than something committed:
# artifacts/ is gitignored on purpose, and a repository that carries its own build output pays
# that cost on every clone forever.
#
# Every push to main builds, tests, signs, and publishes a release. The version comes from
# Directory.Build.props: its major.minor is the release line, and the patch is bumped past the
# highest v<major>.<minor>.* tag already released. Changing the props version (for example to
# 1.2.0) starts a new line at exactly that version. Running it by hand can name a version
# explicitly, and can draft the release instead of publishing it.
name: Release

on:
  push:
    branches:
      - main
    # Documentation-only changes do not change the binary, so they do not cut a release.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.1.3). Blank bumps the patch."
        required: false
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false

# Two overlapping runs would compute the same next patch and race to create one tag.
concurrency:
  group: release
  cancel-in-progress: false

# The job creates a release, which is a write to the repository.
permissions:
  contents: write
  id-token: write

jobs:
  # A push can be delivered more than once - one commit here started two runs, and the
  # concurrency group ran them back to back, publishing the same build as v1.1.1 and v1.1.2. A
  # commit that already carries a release tag has been released; manual runs are exempt because
  # re-releasing on purpose is what they are for.
  check:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.tags.outputs.released }}
    steps:
      - id: tags
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          tags=$(git ls-remote --tags "$REPO_URL" 'refs/tags/v*' | awk -v sha="$GITHUB_SHA" '$1 == sha { print $2 }')
          if [ -n "$tags" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Commit $GITHUB_SHA is already released as: $tags"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.released != 'true'
    # WPF, and the app is Windows-only. There is no cross-compilation route for this target.
    runs-on: windows-latest
    # Gives OIDC one stable, environment-bound subject for main and manual runs. GitHub emits this
    # repository's immutable owner/repository IDs in the token rather than its renameable names.
    environment: release

    # Signing identity is repository configuration, never hardcoded here: a certificate says who
    # vouches for the binary, so the account and profile belong to whoever publishes this build.
    # OIDC carries no stored Azure password; secrets hide the directory/application identifiers,
    # while variables carry the non-secret signing resource names. Absent both, the build still
    # runs and ships unsigned, which keeps the release path working before signing exists.
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_CERTIFICATE_PROFILE != '' }}
      ANY_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' || secrets.AZURE_TENANT_ID != '' || secrets.AZURE_SUBSCRIPTION_ID != '' || vars.AZURE_SIGNING_ACCOUNT != '' || vars.AZURE_CERTIFICATE_PROFILE != '' }}
      # Region-specific, and a mismatch fails with an unhelpful authorization error rather than a
      # wrong-endpoint one. Defaulted only because a default is harmless when the account is unset.
      SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT || 'https://wus2.codesigning.azure.net/' }}
      SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}

    steps:
      # Half-configured signing is a mistake rather than a choice: it means someone set the
      # secrets and forgot the variables, or rotated one of three credentials. Shipping unsigned
      # in that state would look identical to shipping unsigned deliberately, so it fails instead.
      - name: Check signing configuration
        if: env.HAS_SIGNING != 'true' && env.ANY_SIGNING == 'true'
        shell: pwsh
        run: |
          throw @"
          Azure Trusted Signing is partially configured. All five are required:
            secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID
            variables: AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE
          Clear all five to build unsigned on purpose.
          "@

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          # The repo pins no global.json, so the SDK feature band is chosen here instead. Kept as
          # a wildcard within the major version so patch updates are picked up without edits.
          dotnet-version: "10.0.x"

      # An explicit manual version wins. Otherwise the props version is used as-is when its
      # major.minor line has no release yet, and the next unused patch when it does. Tags are read
      # from the remote rather than the shallow checkout, which fetches none.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:REQUESTED_VERSION".Trim()

          if (-not $version) {
            [xml]$props = Get-Content Directory.Build.props
            $base = "$($props.Project.PropertyGroup.Version)".Trim()
            if (-not ($base -match '^(\d+)\.(\d+)\.(\d+)$')) {
              throw "Directory.Build.props Version '$base' must be major.minor.patch."
            }

            $major, $minor, $patch = [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]
            $released = @(git ls-remote --tags origin "refs/tags/v$major.$minor.*" |
              ForEach-Object { if ($_ -match "refs/tags/v$major\.$minor\.(\d+)$") { [int]$Matches[1] } })
            if ($LASTEXITCODE -ne 0) { throw "Could not list tags from origin." }

            if ($released.Count -gt 0) {
              $patch = [math]::Max($patch, ($released | Measure-Object -Maximum).Maximum + 1)
            }

            $version = "$major.$minor.$patch"
          }

          if (-not ($version -match '^\d+\.\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$')) {
            throw "Version '$version' is not a valid semantic version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore SemanticStart.slnx

      - name: Build
        run: dotnet build SemanticStart.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # Gating the release on the suite is the point of building it here rather than uploading
      # whatever happened to be on someone's machine. The relevance harness is deliberately not
      # run: it scores against an index of the software installed on the machine that built it,
      # so on a bare runner it would be measuring the runner.
      - name: Test
        run: dotnet test tests/SemanticStart.Tests -c Release --no-build --verbosity normal

      # PublishSingleFile still leaves the native dependencies - onnxruntime, the SQLite engine,
      # WPF's unmanaged bits - beside the exe, which is why each download is a zip of a folder
      # rather than a bare exe.
      - name: Publish portable builds
        shell: pwsh
        run: |
          foreach ($architecture in 'win-x64', 'win-arm64') {
            dotnet publish src/SemanticStart.App `
              -c Release `
              -r $architecture `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:Version=${{ steps.version.outputs.version }} `
              -o "artifacts/portable/$architecture"

            if ($LASTEXITCODE -ne 0) {
              throw "Publishing $architecture failed with exit code $LASTEXITCODE."
            }
          }

      # Debug symbols and import libraries are build by-products. They are of no use to someone
      # running the app and add tens of megabytes to a download that is already large.
      - name: Trim build by-products
        shell: pwsh
        run: >
          Get-ChildItem artifacts/portable -Recurse -File
          | Where-Object { $_.Extension -in '.pdb', '.lib' }
          | Remove-Item -Force

      # Signing happens here, after trimming and before packaging, so the zip contains the signed
      # exe and the published SHA256 is the hash of what people actually run. Signing after the
      # zip would leave the checksum describing a different binary.
      #
      # Only each architecture's SemanticStart.App.exe needs a signature. The native dependencies -
      # onnxruntime, the SQLite engine, WPF's unmanaged bits - already ship signed by Microsoft.
      #
      # GitHub exchanges its short-lived OIDC token for an Azure token. The federated credential
      # accepts only this repository's release environment, so there is no Azure password to
      # rotate or steal from repository secrets.
      - name: Log in to Azure for signing
        if: env.HAS_SIGNING == 'true'
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the executable
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\portable\win-x64\SemanticStart.App.exe
            ${{ github.workspace }}\artifacts\portable\win-arm64\SemanticStart.App.exe
          file-digest: SHA256
          # Countersigns the signature with a trusted timestamp, so the binary stays valid after
          # the signing certificate expires. Trusted Signing certificates are short-lived by
          # design - days, not years - which makes this mandatory rather than merely advisable.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # azure/login has already authenticated the CLI with OIDC. Disable every other
          # DefaultAzureCredential path so a runner-local identity cannot be selected by mistake.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # The signing step can succeed without producing a usable signature, so the claim is checked
      # against the file rather than trusted. Reading back the subject also puts the publisher
      # identity in the log, which is the thing worth noticing if it is ever wrong.
      - name: Verify the signature
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($architecture in 'win-x64', 'win-arm64') {
            $exe = "artifacts/portable/$architecture/SemanticStart.App.exe"
            $sig = Get-AuthenticodeSignature $exe

            if ($sig.Status -ne 'Valid') {
              throw "Signature on $exe is '$($sig.Status)': $($sig.StatusMessage)"
            }

            Write-Host "$architecture signed by: $($sig.SignerCertificate.Subject)"
            Write-Host "$architecture timestamp: $($sig.TimeStamperCertificate.Subject)"

            if (-not $sig.TimeStamperCertificate) {
              throw "Signature on $exe is not timestamped; it would stop validating when the certificate expires."
            }
          }

      - name: Warn that the build is unsigned
        if: env.HAS_SIGNING != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning title=Unsigned build::Azure Trusted Signing is not configured, so this build ships unsigned and SmartScreen will warn on download."

      - name: Package
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/upload | Out-Null

          $packages = @(
            @{ Architecture = 'win-x64'; HashOutput = 'x64_sha256' }
            @{ Architecture = 'win-arm64'; HashOutput = 'arm64_sha256' }
          )

          foreach ($package in $packages) {
            $name = "SemanticStart-${{ steps.version.outputs.version }}-$($package.Architecture)"
            $zip = "artifacts/upload/$name.zip"
            Compress-Archive -Path "artifacts/portable/$($package.Architecture)/*" -DestinationPath $zip -CompressionLevel Optimal

            # Published so a download can be verified; a self-contained runtime is exactly the
            # kind of payload worth checking before running.
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            "$hash  $name.zip" | Set-Content "artifacts/upload/$name.zip.sha256"
            "$($package.HashOutput)=$hash" >> $env:GITHUB_OUTPUT
            Write-Host "Packaged $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
          }

      # Uploaded separately from the release so the build is still downloadable from the run when
      # a release is a draft, or when the release step fails.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SemanticStart-${{ steps.version.outputs.version }}-Windows
          path: artifacts/upload/
          retention-days: 30

      # The GitHub CLI is preinstalled on the runner and authenticates from GITHUB_TOKEN, so this
      # needs no third-party action in the supply chain of a binary people download and run.
      # --generate-notes writes the commit log since the previous release.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'

          # Whether the download is signed changes what someone sees when they run it, so the
          # notes say which it is rather than leaving them to find out from a SmartScreen dialog.
          if ('${{ env.HAS_SIGNING }}' -eq 'true') {
            $signing = 'This build is code-signed, so Windows shows the publisher name rather than "Unknown publisher". SmartScreen may still warn until the download builds reputation.'
          } else {
            $signing = 'This build is **not** code-signed. SmartScreen will warn when you run it; choose **More info -> Run anyway** if you trust the source. Verify the SHA256 below first.'
          }

          # A single-quoted here-string, because the notes are markdown full of backticks and the
          # backtick is PowerShell's escape character - the double-quoted form silently eats them.
          # Workflow expressions are substituted into the script text before pwsh ever sees it, so
          # the SHA below is still interpolated despite the quoting.
          $notes = @'
          Portable, self-contained Windows builds for AMD64 (`win-x64`) and ARM64 (`win-arm64`). No .NET runtime required.

          **Install:** download the zip for your processor, unblock it (Properties -> Unblock, or `Unblock-File`), extract anywhere, and run `SemanticStart.App.exe`. It lives in the tray and builds its index on first run, downloading the embedding model once.

          SHA256:

          ```
          ${{ steps.package.outputs.x64_sha256 }}  SemanticStart-${{ steps.version.outputs.version }}-win-x64.zip
          ${{ steps.package.outputs.arm64_sha256 }}  SemanticStart-${{ steps.version.outputs.version }}-win-arm64.zip
          ```
          '@

          $notes = $notes + "`n`n" + $signing

          # Not $args, which is an automatic variable in PowerShell.
          $releaseArgs = @(
            $tag
            '--title', "SemanticStart $tag"
            '--notes', $notes
            '--generate-notes'
          )

          if ('${{ inputs.draft }}' -eq 'true') { $releaseArgs += '--draft' }

          # The tag does not exist yet; gh creates it on the commit that was built.
          $releaseArgs += @('--target', $env:GITHUB_SHA)

          # Exit code rather than output: gh prints to stderr when a release is missing, and an
          # empty-string result would be indistinguishable from a genuine failure to reach it.
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            Write-Host "Release $tag already exists; replacing its assets."
            gh release upload $tag (Get-Item artifacts/upload/*).FullName --clobber
          } else {
            gh release create @releaseArgs (Get-Item artifacts/upload/*).FullName
          }

          if ($LASTEXITCODE -ne 0) { throw "gh failed with exit code $LASTEXITCODE." }
