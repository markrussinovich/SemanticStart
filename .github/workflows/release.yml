# Builds the portable, self-contained app and publishes it as a downloadable GitHub Release.
#
# The artifact is ~180 MB, which is why it is a release asset rather than something committed:
# artifacts/ is gitignored on purpose, and a repository that carries its own build output pays
# that cost on every clone forever.
#
# Two ways in. Pushing a v* tag releases that version, which is the normal path. Running it by
# hand builds the same thing for a version you name, so a release can be rehearsed - or reissued
# after a bad one - without inventing a throwaway tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, without the leading v (e.g. 1.0.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: true

# The job creates a release, which is a write to the repository.
permissions:
  contents: write

jobs:
  release:
    # WPF, and the app is Windows-only. There is no cross-compilation route for this target.
    runs-on: windows-latest

    # Signing identity is repository configuration, never hardcoded here: a certificate says who
    # vouches for the binary, so the account and profile belong to whoever publishes this build.
    # Secrets carry the credential; variables carry the non-secret names. Absent both, the build
    # still runs and ships unsigned, which keeps the release path working before signing exists.
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_CERTIFICATE_PROFILE != '' }}
      ANY_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' || secrets.AZURE_CLIENT_SECRET != '' || secrets.AZURE_TENANT_ID != '' || vars.AZURE_SIGNING_ACCOUNT != '' || vars.AZURE_CERTIFICATE_PROFILE != '' }}
      # Region-specific, and a mismatch fails with an unhelpful authorization error rather than a
      # wrong-endpoint one. Defaulted only because a default is harmless when the account is unset.
      SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT || 'https://wus2.codesigning.azure.net/' }}
      SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}

    steps:
      # Half-configured signing is a mistake rather than a choice: it means someone set the
      # secrets and forgot the variables, or rotated one of three credentials. Shipping unsigned
      # in that state would look identical to shipping unsigned deliberately, so it fails instead.
      - name: Check signing configuration
        if: env.HAS_SIGNING != 'true' && env.ANY_SIGNING == 'true'
        shell: pwsh
        run: |
          throw @"
          Azure Trusted Signing is partially configured. All five are required:
            secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
            variables: AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE
          Clear all five to build unsigned on purpose.
          "@

      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The repo pins no global.json, so the SDK feature band is chosen here instead. Kept as
          # a wildcard within the major version so patch updates are picked up without edits.
          dotnet-version: "10.0.x"

      # A tag is the source of truth when there is one; the manual input is the fallback. Failing
      # loudly on an empty result matters because every later step would otherwise succeed and
      # produce an asset named after nothing.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $version = '${{ inputs.version }}'
          }

          $version = $version.Trim()
          if (-not ($version -match '^\d+\.\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$')) {
            throw "Version '$version' is not a valid semantic version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore SemanticStart.slnx

      - name: Build
        run: dotnet build SemanticStart.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # Gating the release on the suite is the point of building it here rather than uploading
      # whatever happened to be on someone's machine. The relevance harness is deliberately not
      # run: it scores against an index of the software installed on the machine that built it,
      # so on a bare runner it would be measuring the runner.
      - name: Test
        run: dotnet test tests/SemanticStart.Tests -c Release --no-build --verbosity normal

      # Matches the command the README documents, so what ships is what a contributor building
      # locally gets. PublishSingleFile still leaves the native dependencies - onnxruntime, the
      # SQLite engine, WPF's unmanaged bits - beside the exe, which is why the download is a zip
      # of a folder rather than a bare exe.
      - name: Publish portable build
        run: >
          dotnet publish src/SemanticStart.App
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/portable

      # Debug symbols and import libraries are build by-products. They are of no use to someone
      # running the app and add tens of megabytes to a download that is already large.
      - name: Trim build by-products
        shell: pwsh
        run: >
          Get-ChildItem artifacts/portable -Recurse -File
          | Where-Object { $_.Extension -in '.pdb', '.lib' }
          | Remove-Item -Force

      # Signing happens here, after trimming and before packaging, so the zip contains the signed
      # exe and the published SHA256 is the hash of what people actually run. Signing after the
      # zip would leave the checksum describing a different binary.
      #
      # Only SemanticStart.App.exe needs a signature. The native dependencies beside it -
      # onnxruntime, the SQLite engine, WPF's unmanaged bits - already ship signed by Microsoft.
      #
      # No azure/login step: the action authenticates from the credentials passed to it directly,
      # so nothing else needs to join the supply chain of a binary people download and run.
      - name: Sign the executable
        if: env.HAS_SIGNING == 'true'
        uses: azure/trusted-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\portable
          files-folder-filter: exe
          file-digest: SHA256
          # Countersigns the signature with a trusted timestamp, so the binary stays valid after
          # the signing certificate expires. Trusted Signing certificates are short-lived by
          # design - days, not years - which makes this mandatory rather than merely advisable.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The signing step can succeed without producing a usable signature, so the claim is checked
      # against the file rather than trusted. Reading back the subject also puts the publisher
      # identity in the log, which is the thing worth noticing if it is ever wrong.
      - name: Verify the signature
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        run: |
          $exe = "artifacts/portable/SemanticStart.App.exe"
          $sig = Get-AuthenticodeSignature $exe

          if ($sig.Status -ne 'Valid') {
            throw "Signature on $exe is '$($sig.Status)': $($sig.StatusMessage)"
          }

          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($sig.TimeStamperCertificate.Subject)"

          if (-not $sig.TimeStamperCertificate) {
            throw "Signature is not timestamped; it would stop validating when the certificate expires."
          }

      - name: Warn that the build is unsigned
        if: env.HAS_SIGNING != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning title=Unsigned build::Azure Trusted Signing is not configured, so this build ships unsigned and SmartScreen will warn on download."

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "SemanticStart-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Force -Path artifacts/upload | Out-Null

          $zip = "artifacts/upload/$name.zip"
          Compress-Archive -Path artifacts/portable/* -DestinationPath $zip -CompressionLevel Optimal

          # Published so a download can be verified; a self-contained runtime is exactly the kind
          # of payload worth checking before running.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $name.zip" | Set-Content "artifacts/upload/$name.zip.sha256"

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # Uploaded separately from the release so the build is still downloadable from the run when
      # a release is a draft, or when the release step fails.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SemanticStart-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/upload/
          retention-days: 30

      # The GitHub CLI is preinstalled on the runner and authenticates from GITHUB_TOKEN, so this
      # needs no third-party action in the supply chain of a binary people download and run.
      # --generate-notes writes the commit log since the previous release.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'

          # Whether the download is signed changes what someone sees when they run it, so the
          # notes say which it is rather than leaving them to find out from a SmartScreen dialog.
          if ('${{ env.HAS_SIGNING }}' -eq 'true') {
            $signing = 'This build is code-signed, so Windows shows the publisher name rather than "Unknown publisher". SmartScreen may still warn until the download builds reputation.'
          } else {
            $signing = 'This build is **not** code-signed. SmartScreen will warn when you run it; choose **More info -> Run anyway** if you trust the source. Verify the SHA256 below first.'
          }

          # A single-quoted here-string, because the notes are markdown full of backticks and the
          # backtick is PowerShell's escape character - the double-quoted form silently eats them.
          # Workflow expressions are substituted into the script text before pwsh ever sees it, so
          # the SHA below is still interpolated despite the quoting.
          $notes = @'
          Portable, self-contained Windows x64 build. No .NET runtime required.

          **Install:** download the zip, unblock it (Properties -> Unblock, or `Unblock-File`), extract anywhere, and run `SemanticStart.App.exe`. It lives in the tray and builds its index on first run, downloading the embedding model once.

          SHA256 of the zip:

          ```
          ${{ steps.package.outputs.sha256 }}
          ```
          '@

          $notes = $notes + "`n`n" + $signing

          # Not $args, which is an automatic variable in PowerShell.
          $releaseArgs = @(
            $tag
            '--title', "SemanticStart $tag"
            '--notes', $notes
            '--generate-notes'
          )

          if ('${{ inputs.draft }}' -eq 'true') { $releaseArgs += '--draft' }

          # A manual run has no tag behind it, so gh is told which commit to tag.
          if ($env:GITHUB_REF -notlike 'refs/tags/*') { $releaseArgs += @('--target', $env:GITHUB_SHA) }

          # Exit code rather than output: gh prints to stderr when a release is missing, and an
          # empty-string result would be indistinguishable from a genuine failure to reach it.
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            Write-Host "Release $tag already exists; replacing its assets."
            gh release upload $tag (Get-Item artifacts/upload/*).FullName --clobber
          } else {
            gh release create @releaseArgs (Get-Item artifacts/upload/*).FullName
          }

          if ($LASTEXITCODE -ne 0) { throw "gh failed with exit code $LASTEXITCODE." }
