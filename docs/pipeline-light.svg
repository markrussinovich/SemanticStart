<text x="102" y="200" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0.6" fill="#656d76">local, 2.4 ms median — never touches the network</text>
<rect x="214" y="214" width="462" height="146" rx="10" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="228" y="234" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.6" fill="#656d76">HYBRID RETRIEVAL</text>
<rect x="24" y="262" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="99.0" y="286.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Win+Alt+.</text><text x="99.0" y="304.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">global hotkey</text>
<line x1="174" y1="290" x2="212" y2="290" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="236" y="246" width="178" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="325.0" y="264.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Vector arm</text><text x="325.0" y="282.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">cosine similarity</text>
<rect x="236" y="302" width="178" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="325.0" y="320.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Lexical arm</text><text x="325.0" y="338.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">FTS5 BM25</text>
<rect x="464" y="274" width="178" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="553.0" y="292.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">RRF fusion</text><text x="553.0" y="310.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">+ boosts, floors</text>
