<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="SemanticStart pipeline: collectors, enrichment, synthesis and embeddings build a SQLite index; a hotkey runs a vector arm and a BM25 arm in parallel, fused by reciprocal rank fusion into the overlay.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text x="24" y="26" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#0969da">INDEXING</text>
<text x="96" y="26" text-anchor="start" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0.6" fill="#656d76">offline, once — about 7 minutes</text>
<rect x="24" y="40" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="99.0" y="64.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Collectors</text><text x="99.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">8 sources</text>
<rect x="194" y="40" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="269.0" y="64.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Enrichment</text><text x="269.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">9 enrichers</text>
<rect x="364" y="40" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="439.0" y="64.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Synthesis</text><text x="439.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">tasks, synonyms</text>
<rect x="534" y="40" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="609.0" y="64.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Embeddings</text><text x="609.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">MiniLM, 384-d</text>
<line x1="174" y1="68.0" x2="192" y2="68.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
