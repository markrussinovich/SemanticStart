<line x1="684" y1="68.0" x2="702" y2="68.0" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="704" y="40" width="172" height="56" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="790.0" y="64.0" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Consolas',monospace" font-size="13" font-weight="600" fill="#1f2328">index.sqlite</text><text x="790.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">FTS5 + vectors</text>
<path d="M790,96 L790,140 Q790,150 780,150 L460,150 Q450,150 450,160 L450,208" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
