<rect x="726" y="262" width="150" height="56" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="801.0" y="286.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Overlay</text><text x="801.0" y="304.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#656d76">8 results</text>
